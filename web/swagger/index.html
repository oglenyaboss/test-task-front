<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WMS Test API</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        background-color: #0f172a;
      }
      #swagger-ui {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        SwaggerUIBundle({
          url: "/openapi.yaml",
          dom_id: "#swagger-ui",
          layout: "BaseLayout",
          deepLinking: true,
        });
      });
    </script>
  </body>
</html>
